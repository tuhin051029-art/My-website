<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TuHin — Creative Studio</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

:root{
  --bg:#070d25;
  --card:#101a3c;
  --text:#ffffff;
  --muted:#b8c2df;
  --blue:#4f9cff;
  --border:#24345f;
}

body{
  background:var(--bg);
  color:var(--text);
  line-height:1.6;
  transition:.3s;
}

body.light{
  --bg:#f4f7ff;
  --card:#ffffff;
  --text:#111827;
  --muted:#596579;
  --border:#dbe2f0;
}

header{
  position:sticky;
  top:0;
  z-index:100;
  background:var(--bg);
  padding:14px 5%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:1px solid var(--border);
}

.logo{
  font-size:25px;
  font-weight:bold;
  color:var(--blue);
}

nav{
  display:flex;
  align-items:center;
}

nav a{
  color:var(--text);
  text-decoration:none;
  margin-left:15px;
  font-size:14px;
}

section{
  padding:70px 6%;
  max-width:1100px;
  margin:auto;
}

.hero{
  min-height:88vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
}

.hero small{
  color:var(--blue);
  letter-spacing:4px;
}

.hero h1{
  font-size:45px;
  margin:20px 0;
}

.blue{
  color:var(--blue);
}

button{
  border:0;
  border-radius:25px;
  padding:12px 20px;
  background:#2764ff;
  color:white;
  font-size:15px;
  cursor:pointer;
  margin:5px;
}

button:hover{
  opacity:.85;
  transform:translateY(-1px);
}

.secondary{
  background:#283452;
}
